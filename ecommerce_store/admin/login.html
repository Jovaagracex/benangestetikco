<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — BenangEstetik Co.</title>
    <meta name="description" content="Panel Administrator BenangEstetik Co. — Erlangga Satria Pratama, SMKN 1 Jenangan Ponorogo.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root{--bg:#F8FAFC;--card:#FFFFFF;--border:#E2E8F0;--gold:#C2724F;--goldH:#A85D3F;--goldL:#FEE4D6;--cream:#1E293B;--muted:#64748B;--terra:#C2724F;--green:#22C55E;--red:#EF4444}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow-x:hidden;padding:1.5rem}
        body::before{content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(194,114,79,.06) 0%,transparent 70%);pointer-events:none;z-index:0}
        body::after{content:'';position:absolute;bottom:-20%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(194,114,79,.06) 0%,transparent 70%);pointer-events:none;z-index:0}
        h1,h2,h3{font-family:'Poppins',sans-serif}
        .wrap{position:relative;z-index:10;width:100%;max-width:440px}
        .brand{text-align:center;margin-bottom:2rem}
        .brand-icon{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,rgba(194,114,79,.12),rgba(194,114,79,.08));border:1px solid rgba(194,114,79,.2);display:inline-flex;align-items:center;justify-content:center;color:var(--gold);font-size:1.8rem;margin-bottom:1rem;box-shadow:0 8px 25px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.1);transition:all .4s}
        .card{background:rgba(255,255,255,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:24px;padding:2.25rem 2rem;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
        .label{font-size:.825rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-bottom:.5rem}
        .input-wrap{position:relative;margin-bottom:1.25rem}
        .input-wrap .icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;z-index:5;transition:color .3s}
        .input{width:100%;background:#F1F5F9;border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem .85rem 2.75rem;color:var(--cream);font-size:.95rem;transition:all .3s}
        .input:focus{outline:none;border-color:var(--gold);background:#FFFFFF;box-shadow:0 0 0 4px rgba(201,169,106,.15)}
        .input:focus~.icon{color:var(--gold)}
        .input::placeholder{color:rgba(163,150,140,.5)}
        .btn-gold{width:100%;background:linear-gradient(135deg,var(--gold),var(--goldH));color:#FFFFFF;font-weight:700;font-size:.95rem;padding:.9rem;border:none;border-radius:12px;cursor:pointer;transition:all .3s;box-shadow:0 4px 12px rgba(194,114,79,.25);display:flex;align-items:center;justify-content:center;gap:.5rem;font-family:'Poppins',sans-serif}
        .btn-gold:hover{background:linear-gradient(135deg,#D4AF37,var(--gold));transform:translateY(-2px);box-shadow:0 6px 20px rgba(194,114,79,.35);color:#FFFFFF}
        .btn-gold:active{transform:translateY(0)}
        .btn-gold:disabled{opacity:.6;cursor:not-allowed;transform:none}
        .btn-ghost{background:transparent;border:1px dashed rgba(194,114,79,.3);color:var(--gold);font-size:.825rem;font-weight:500;padding:.55rem 1rem;border-radius:8px;width:100%;transition:all .25s;cursor:pointer;font-family:'Inter',sans-serif}
        .btn-ghost:hover{background:rgba(194,114,79,.08);border-color:var(--gold);color:var(--goldL)}
        .notif{padding:.85rem 1rem;border-radius:10px;font-size:.85rem;margin-bottom:1.25rem;display:none;align-items:center;gap:.5rem;animation:fadeSlide .3s}
        @keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
        .notif.error{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);color:#DC2626}
        .notif.success{background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.3);color:#16A34A}
        .notif.info{background:rgba(194,114,79,.06);border:1px solid rgba(194,114,79,.2);color:var(--goldL)}
        .footer{margin-top:2rem;text-align:center}
        .badge-id{display:inline-block;background:#F1F5F9;border:1px solid #E2E8F0;padding:.6rem 1.2rem;border-radius:50px;margin-bottom:1rem}
        .dev-name{font-size:.85rem;font-weight:600;color:var(--gold)}
        .dev-school{font-size:.75rem;color:var(--muted)}
        .socials{display:flex;justify-content:center;gap:.8rem;margin-bottom:1rem}
        .social-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.9rem;text-decoration:none;transition:all .3s}
        .social-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(194,114,79,.08);transform:translateY(-2px)}
        .back{color:var(--muted);font-size:.85rem;text-decoration:none;transition:color .2s;display:inline-flex;align-items:center;gap:.4rem}
        .back:hover{color:var(--gold)}
        :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
        .preloader{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s ease}
        .preloader.hidden{opacity:0;visibility:hidden;pointer-events:none}
        .preloader-logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--gold),var(--goldH));display:flex;align-items:center;justify-content:center;color:#fff;font-family:Poppins,sans-serif;font-weight:900;font-size:1.8rem;margin-bottom:1.25rem;box-shadow:0 8px 30px rgba(194,114,79,.3);animation:pulseLogo 1.8s ease-in-out infinite}
        @keyframes pulseLogo{0%,100%{transform:scale(1);box-shadow:0 8px 30px rgba(194,114,79,.3)}50%{transform:scale(1.06);box-shadow:0 12px 40px rgba(194,114,79,.45)}}
        .preloader-text{font-family:Poppins,sans-serif;font-weight:700;font-size:1rem;color:var(--cream);margin-bottom:.5rem}
        .preloader-sub{font-size:.82rem;color:var(--muted);margin-bottom:1.5rem}
        .preloader-dots{display:flex;gap:6px}
        .preloader-dots span{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:dotBounce 1.2s ease-in-out infinite}
        .preloader-dots span:nth-child(2){animation-delay:.15s}
        .preloader-dots span:nth-child(3){animation-delay:.3s}
        @keyframes dotBounce{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1.1)}}
    </style>
</head>
<body>

    <!-- Preloader -->
    <div class="preloader" id="preloader">
      <div class="preloader-logo">B</div>
      <div class="preloader-text">Memuat Admin Panel...</div>
      <div class="preloader-sub">BenangEstetik Co. &middot; Erlangga Satria Pratama</div>
      <div class="preloader-dots"><span></span><span></span><span></span></div>
    </div>


<div class="wrap">
    <div class="brand">
        <div class="brand-icon" style="font-family:Poppins,sans-serif;font-weight:900;font-size:1.6rem">B</div>
        <h1 style="font-size:1.6rem;font-weight:700;letter-spacing:-.5px">Admin Login</h1>
        <p style="font-size:.9rem;color:var(--muted)">Panel Utama BenangEstetik Co.</p>
    </div>

    <div class="card">
        <div class="notif" id="notifBox" role="alert">
            <i class="fas fa-info-circle" id="notifIcon"></i>
            <span id="notifMsg"></span>
        </div>

        <form id="loginForm" novalidate>
            <div>
                <label class="label" for="loginEmail">Email Administrator</label>
                <div class="input-wrap">
                    <input type="email" id="loginEmail" class="input" value="admin@benangestetik.com" placeholder="admin@benangestetik.com" required autocomplete="username">
                    <i class="fas fa-envelope icon"></i>
                </div>
            </div>
            <div>
                <label class="label" for="loginPassword">Password</label>
                <div class="input-wrap">
                    <input type="password" id="loginPassword" class="input" value="admin123456" placeholder="Masukkan password" required autocomplete="current-password">
                    <i class="fas fa-lock icon"></i>
                </div>
            </div>
            <div style="margin-top:1.5rem;margin-bottom:1rem">
                <button type="submit" class="btn-gold" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i> Masuk Admin
                </button>
            </div>
        </form>

        <button type="button" class="btn-ghost" id="btnQuickFill">
            <i class="fas fa-magic me-1"></i> Isi Kredensial Default
        </button>
    </div>

    <div class="footer">
        <div class="badge-id">
            <div class="dev-name">Erlangga Satria Pratama</div>
            <div class="dev-school">SMKN 1 Jenangan Ponorogo</div>
        </div>
        <div class="socials">
            <a href="https://wa.me/6285175208067" target="_blank" rel="noopener" class="social-btn" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            <a href="https://t.me/givadaa" target="_blank" rel="noopener" class="social-btn" title="Telegram"><i class="fab fa-telegram"></i></a>
            <a href="https://instagram.com/erlangszc" target="_blank" rel="noopener" class="social-btn" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://github.com/Jovaagracex" target="_blank" rel="noopener" class="social-btn" title="GitHub"><i class="fab fa-github"></i></a>
        </div>
        <a href="../index.html" class="back"><i class="fas fa-arrow-left"></i> Kembali ke Toko Online</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    'use strict';

    var LOCAL_KEY   = 'admin_logged_in';
    var SESSION_KEY = 'benangestetik_admin_session';
    var LOCAL_EMAIL = 'admin@benangestetik.com';
    var LOCAL_PASS  = 'admin123456';

    var notifBox  = document.getElementById('notifBox');
    var notifIcon = document.getElementById('notifIcon');
    var notifMsg  = document.getElementById('notifMsg');
    var btnLogin  = document.getElementById('btnLogin');

    /* ---- Alert: HIDDEN by default, never auto-shows ---- */
    function showNotif(msg, type) {
        var t = type || 'info';
        var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
        notifBox.className = 'notif ' + t;
        notifBox.style.display = 'flex';
        notifIcon.className = 'fas ' + (icons[t] || icons.info) + ' me-1';
        notifMsg.textContent = msg;
    }
    function hideNotif() {
        notifBox.style.display = 'none';
        notifMsg.textContent = '';
    }

    /* ---- Quick Fill ---- */
    document.getElementById('btnQuickFill').addEventListener('click', function () {
        document.getElementById('loginEmail').value = LOCAL_EMAIL;
        document.getElementById('loginPassword').value = LOCAL_PASS;
        showNotif('Kredensial default berhasil diisi.', 'info');
    });

    /* ---- Silent session check (no alert, just redirect) ---- */
    (function checkSession() {
        if (localStorage.getItem(LOCAL_KEY) === 'true' || localStorage.getItem(SESSION_KEY) === 'true') {
            window.location.href = 'dashboard.html';
            return;
        }
        try {
            var client = window.supabaseClient || (typeof supabase !== 'undefined' ? supabase : null);
            if (client && client.auth) {
                client.auth.getSession().then(function (res) {
                    if (res && res.data && res.data.session) {
                        localStorage.setItem(LOCAL_KEY, 'true');
                        localStorage.setItem(SESSION_KEY, 'true');
                        window.location.href = 'dashboard.html';
                    }
                }).catch(function () {});
            }
        } catch (e) {}
    })();

    /* ---- Main Login Handler ---- */
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideNotif();

        var email    = document.getElementById('loginEmail').value.trim().toLowerCase();
        var password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            showNotif('Mohon isi email dan password.', 'error');
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Memverifikasi...';

        function loginSuccess(msg) {
            localStorage.setItem(LOCAL_KEY, 'true');
            localStorage.setItem(SESSION_KEY, 'true');
            showNotif(msg || 'Login berhasil! Mengalihkan ke dashboard...', 'success');
            setTimeout(function () { window.location.href = 'dashboard.html'; }, 700);
        }

        /* Step 1: Try Supabase real auth */
        var client = window.supabaseClient || (typeof supabase !== 'undefined' ? supabase : null);
        if (client && client.auth) {
            try {
                var res = await client.auth.signInWithPassword({ email: email, password: password });
                if (!res.error && res.data && res.data.session) {
                    loginSuccess('Login Supabase berhasil! Mengalihkan...');
                    return;
                }
                /* If Supabase login fails for default admin, try auto-create then retry */
                if (email === LOCAL_EMAIL) {
                    try {
                        var signUp = await client.auth.signUp({ email: email, password: password });
                        if (!signUp.error) {
                            var retry = await client.auth.signInWithPassword({ email: email, password: password });
                            if (!retry.error) {
                                loginSuccess('Akun admin dibuat otomatis. Mengalihkan...');
                                return;
                            }
                        }
                    } catch (se) {}
                }
            } catch (netErr) {
                /* Network error — will fall through to local fallback */
            }
        }

        /* Step 2: Local fallback (instant, no network) */
        if (email === LOCAL_EMAIL && password === LOCAL_PASS) {
            loginSuccess('Login berhasil (mode lokal)! Mengalihkan ke dashboard...');
            return;
        }

        /* Step 3: All failed */
        showNotif('Email atau password salah. Silakan periksa kembali.', 'error');
        btnLogin.disabled = false;
        btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk Admin';
    });
});
</script>

<script>
function hidePreloader() {
  var pl = document.getElementById('preloader');
  if (pl) pl.classList.add('hidden');
}
document.addEventListener('DOMContentLoaded', hidePreloader);
window.addEventListener('load', hidePreloader);
setTimeout(hidePreloader, 100);
</script>
</body>
</html>
