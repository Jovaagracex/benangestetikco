    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C2724F;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8D6B4C;stop-opacity:0.08"/>
